<head>

<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

</head>

<body>
<a class="skip-link" href="#main">본문으로 건너뛰기 · Skip to content</a>

<div class="app">
  <header class="topnav" id="topnav"></header>

  <div class="body-grid">
    <nav class="subnav" id="subnav" aria-label="팀 서식 선택"></nav>

    <main class="main" id="main">

      <div style="margin-bottom:var(--s-5)">
        <p class="eyebrow" style="margin-bottom:6px">Electronic Batch Record</p>
        <h1 style="font-size:22px">Data 입력</h1>
        <p style="font-size:13px;color:var(--c-text-mute);margin:6px 0 0">
          과제 → Study → 팀 → Batch → Sample 순으로 대상을 지정합니다.
          팀을 고르기 전에는 입력 폼이 열리지 않습니다.
        </p>
        <div class="crumb" id="crumb" style="margin-top:var(--s-3)"></div>
      </div>

      <!-- 기록 대상 선택만 둡니다 (StudySelector mode:"pick").
           조회 바가 아닙니다 — 검색어 · 기간 · 정렬 · 조회/초기화 ·
           조건 태그는 이 화면에서 할 일이 없고, 입력 폼을 아래로
           밀어냅니다. 데이터를 찾는 일은 데이터 조회 화면에서 합니다. -->
      <div id="selector" style="margin-bottom:var(--s-4)"></div>

      <!-- 드롭다운에 없는 Study · Batch 를 그 자리에서 만듭니다 (ebr-page 가 그립니다) -->
      <div id="entity-bar"></div>

      <div id="form-host"></div>

      <footer class="rule-hair" style="margin-top:var(--s-8);padding-top:var(--s-5);
                                       font-size:11.5px;color:var(--c-text-mute);line-height:1.7">
        모든 입력은 작성자와 시각(초 단위)이 함께 기록되며, 수정 시 이전 값은 삭제되지 않고 이력으로 보존됩니다.<br>
        <!-- 저장 위치는 실제 상태를 읽어 적습니다. 여기에 한쪽을 못박아 두면,
             서버에 연결된 뒤에도 "공유되지 않습니다" 라고 계속 말하게 됩니다 —
             사용자가 그 말을 믿고 따로 또 저장하게 됩니다. -->
        <span id="store-note">입력 데이터의 저장 위치를 확인하는 중입니다…</span>
      </footer>
    </main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>

<script src="assets/js/data-grid.js"></script>
<script src="assets/js/worksheet.js"></script>
<script src="assets/js/ebr-page.js"></script>
<script>
/* 저장 위치를 실제 상태에서 읽어 적습니다 — 못박아 두면 틀린 말이 남습니다 */
(function () {
  const el = document.getElementById("store-note");
  if (!el || !window.HubBoot) return;
  function draw() {
    const n = window.HubBoot.note();
    if (n.mode === "server" && n.serverReady) {
      el.textContent = "입력 데이터는 중앙 데이터베이스에 저장됩니다 — 다른 PC·다른 사람도 같은 값을 봅니다.";
    } else if (n.mode === "server") {
      el.textContent = "서버에서 데이터를 읽지 못했습니다 (" + (n.reason || "") +
                       "). 지금 보이는 값은 최신이 아닐 수 있으니 새로 고쳐 보세요.";
    } else if (n.reason === "로그인 필요") {
      el.textContent = "서버는 켜져 있지만 이 브라우저는 연결되지 않았습니다 — " +
                       "다시 로그인해 '서버 접속 비밀값' 을 입력하세요. 그 전까지 입력은 이 브라우저에만 남습니다.";
    } else {
      el.textContent = "중앙 서버가 설정되지 않아 입력 데이터는 이 브라우저에만 저장됩니다 — 다른 PC 에서는 보이지 않습니다.";
    }
  }
  draw();
  if (window.HubBoot.ready && window.HubBoot.ready.then) window.HubBoot.ready.then(draw).catch(function () {});
  if (window.HubServer && window.HubServer.subscribe) window.HubServer.subscribe(draw);
})();
</script>
</body>
</html>
