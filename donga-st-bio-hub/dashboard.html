<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드 · Bio Knowledge Hub — 동아에스티</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/app.css">
</head>

<body>
<a class="skip-link" href="#main">본문으로 건너뛰기 · Skip to content</a>

<div class="app">
  <header class="topnav" id="topnav"></header>

  <div class="body-grid">
    <nav class="subnav" id="subnav" aria-label="팀별 보기"></nav>

    <main class="main" id="main">

      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-4);
                  flex-wrap:wrap;margin-bottom:var(--s-5)">
        <div>
          <p class="eyebrow" style="margin-bottom:6px">Integrated Dashboard</p>
          <h1 style="font-size:22px" id="page-title">대시보드</h1>
          <div class="crumb" id="crumb" style="margin-top:var(--s-3)"></div>
        </div>
        <button class="btn btn-accent" id="meeting-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <rect x="2" y="4" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3z"/></svg>
          회의 모드
        </button>
      </div>

      <div id="selector" style="margin-bottom:var(--s-4)"></div>

      <section class="grid-kpi" id="kpi" aria-label="핵심 지표" style="margin-bottom:var(--s-4)"></section>

      <div id="body"></div>

      <footer class="rule-hair" style="margin-top:var(--s-8);padding-top:var(--s-5);
                                       font-size:11.5px;color:var(--c-text-mute);line-height:1.7">
        출처: Batch_Data_example.xlsx · 배양 · 분석 항목은 원본 값이며, 공란 · N/A · "-" 는 모두 "미입력"으로 표시하고
        값을 추정하지 않습니다. 정제 항목은 원본에 컬럼이 없어 Study 성격과 배양 결과에 맞춰 생성한 값입니다.<br>
        일정은 원본의 공정 주기(평균 배양 일수)를 현재 시점으로 옮겨 산출했습니다.
      </footer>
    </main>

    <aside class="rail" id="rail" aria-label="미니 캘린더 및 알림"></aside>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>

<script src="assets/js/data/samples.js"></script>
<script src="assets/js/data/entries.js"></script>
<script src="assets/js/data/repo.js"></script>
<script src="assets/js/data/calendar.js"></script>
<script src="assets/js/data/lots.js"></script>
<script src="assets/js/data/requests.js"></script>

<script src="assets/js/charts.js"></script>

<script src="assets/js/dash-page.js"></script>
</body>
</html>
