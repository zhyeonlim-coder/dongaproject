<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 탐색 · Bio Knowledge Hub — 동아에스티</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/app.css">
</head>

<body>
<a class="skip-link" href="#main">본문으로 건너뛰기 · Skip to content</a>

<div class="app">
  <header class="topnav" id="topnav"></header>

  <div class="body-grid">
    <nav class="subnav" id="subnav" aria-label="탐색 메뉴"></nav>

    <main class="main" id="main">

      <div style="margin-bottom:var(--s-5)">
        <p class="eyebrow" style="margin-bottom:6px">Explorer</p>
        <h1 style="font-size:22px">연구 데이터 탐색</h1>
        <p style="font-size:13px;color:var(--c-text-mute);margin:6px 0 0">
          과제 · 계획서 · 보고서(Track A)와 과제 · Batch · 물질(Track B) 두 가지 트리로 탐색합니다.
        </p>
      </div>

      <div class="card" style="border-left:3px solid var(--c-warn);margin-bottom:var(--s-4)">
        <div class="card-body" style="padding:var(--s-3) var(--s-4);font-size:12.5px;color:var(--c-text-mute)">
          이 화면은 앞서 구축한 아카이브 데이터셋(PRJ-2024-011 등)을 사용합니다.
          상단 과제 선택(DA-3880 등)과는 별도 데이터입니다.
        </div>
      </div>

      <div class="split">
        <aside class="card split-nav" aria-label="연구 데이터 트리">
          <div class="card-body" style="padding:var(--s-4)">
            <div class="track-tabs" role="tablist" aria-label="트리 트랙 전환">
              <button class="track-tab" role="tab" data-track="A" aria-selected="true">
                Track A<br><span style="font-weight:400;font-size:10.5px">계획서 · 보고서</span>
              </button>
              <button class="track-tab" role="tab" data-track="B" aria-selected="false">
                Track B<br><span style="font-weight:400;font-size:10.5px">Batch · 물질</span>
              </button>
            </div>
            <div style="position:relative;margin-bottom:var(--s-3)">
              <label class="sr-only" for="tree-search">과제 및 항목 검색</label>
              <input class="input" id="tree-search" type="search" placeholder="과제·Batch·물질 검색"
                     style="min-height:38px;font-size:13px">
            </div>
            <div class="tree" id="tree"></div>
          </div>
        </aside>

        <section id="detail" aria-live="polite"></section>
      </div>

      <footer class="rule-hair" style="margin-top:var(--s-8);padding-top:var(--s-5);
                                       font-size:11.5px;color:var(--c-text-mute);line-height:1.7">
        디자인 컨셉 시안 · 모든 Batch 번호, 공정값, 분석 결과는 예시 데이터입니다.
      </footer>
    </main>

    <aside class="rail" id="rail" aria-label="미니 캘린더 및 알림"></aside>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/lab.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/rnd.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/shell2.js"></script>
<script src="assets/js/explorer.js"></script>
</body>
</html>
